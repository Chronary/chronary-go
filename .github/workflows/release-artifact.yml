name: Release Artifact

# Publishes the Chronary Go SDK source to chronary-go and creates a GitHub Release.
#
# Go modules resolve directly from GitHub — there is no registry publish step.
# Once a tag vX.Y.Z exists on a public repo, users run:
#   go install github.com/Chronary/chronary-go@vX.Y.Z
# proxy.golang.org will cache the module automatically.
#
# While chronary-go is PRIVATE, go install requires GOPRIVATE + GitHub auth.

on:
  push:
    tags:
      - 'v*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create` (no attestation or registry publish).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token, so keep it out of
          # .git/config, where install and test scripts could read it (#1659).
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No restored module/build cache in a tag-triggered release job (#1659).
          cache: false

      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          manifest = json.load(open(".chronary-release.json", "r", encoding="utf-8"))
          if manifest["artifact"] != "go-sdk":
              raise SystemExit("Expected artifact go-sdk")
          if manifest["public_tag"] != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Tag mismatch between manifest and workflow ref")
          PY
          test -f RELEASE_NOTES.txt

      - name: Validate package contents
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f go.mod
          test -f VERSION

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "chronary-go ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
