name: Release Artifact

# Publishes the Chronary Go SDK source to chronary-go and creates a GitHub Release.
#
# Go modules resolve directly from GitHub — there is no registry publish step.
# Once a tag vX.Y.Z exists on a public repo, users run:
#   go install github.com/Chronary/chronary-go@vX.Y.Z
# proxy.golang.org will cache the module automatically.
#
# While chronary-go is PRIVATE, go install requires GOPRIVATE + GitHub auth.

on:
  push:
    tags:
      - 'v*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create` (no attestation or registry publish).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token, so keep it out of
          # .git/config, where install and test scripts could read it (#1659).
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No restored module/build cache in a tag-triggered release job (#1659).
          cache: false

      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          manifest = json.load(open(".chronary-release.json", "r", encoding="utf-8"))
          if manifest["artifact"] != "go-sdk":
              raise SystemExit("Expected artifact go-sdk")
          if manifest["public_tag"] != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Tag mismatch between manifest and workflow ref")
          PY
          test -f RELEASE_NOTES.txt

      - name: Validate package contents
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f go.mod
          test -f VERSION

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # SBOM (EU CRA Annex I Part II (1), #1634): CycloneDX, attached to the
      # GitHub Release. Fail-closed: these run before anything is published,
      # with no continue-on-error, so no release ships without a valid SBOM.
      # Tool pins and the validator live in scripts/public-release/sbom.mjs.
      - name: Generate SBOM
        env:
          # The tool needs a newer Go than some go.mod files ask for; let the
          # go command fetch the toolchain it declares (checksum-verified).
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          # Library: describe the module and its requirements.
          GOBIN="$RUNNER_TEMP/sbom-bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          SBOM_FILE="sbom/chronary-go-${GITHUB_REF_NAME#v}.cdx.json"
          mkdir -p "$(dirname "$SBOM_FILE")"
          "$RUNNER_TEMP/sbom-bin/cyclonedx-gomod" mod -json -licenses \
            -output-version 1.6 -output "$SBOM_FILE" .
          echo "SBOM_FILE=$SBOM_FILE" >> "$GITHUB_ENV"

      - name: Validate SBOM
        env:
          EXPECTED_NAME: 'github.com/Chronary/chronary-go'
        run: |
          node - "$SBOM_FILE" "$EXPECTED_NAME" "${GITHUB_REF_NAME#v}" <<'JS'
          const fs = require('fs');
          const [file, expectedName, expectedVersion] = process.argv.slice(2);
          const fail = (msg) => {
            console.error('::error::SBOM ' + file + ': ' + msg);
            process.exit(1);
          };
          let bom;
          try {
            bom = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (e) {
            fail('not readable JSON (' + e.message + ')');
          }
          if (bom.bomFormat !== 'CycloneDX') fail('bomFormat is ' + JSON.stringify(bom.bomFormat) + ', expected CycloneDX');
          if (!/^1\.[4-9]$/.test(String(bom.specVersion))) fail('unsupported specVersion ' + JSON.stringify(bom.specVersion));
          const main = bom.metadata && bom.metadata.component;
          if (!main) fail('metadata.component is missing');
          const name = [main.group, main.name].filter(Boolean).join('/');
          if (name !== expectedName) fail('main component is ' + JSON.stringify(name) + ', expected ' + JSON.stringify(expectedName));
          const bare = (v) => String(v).replace(/^v/, '');
          if (!expectedVersion) fail('no expected version given');
          if (main.version === undefined || main.version === '') main.version = bare(expectedVersion);
          else if (bare(main.version) !== bare(expectedVersion)) fail('version is ' + main.version + ', expected ' + expectedVersion);
          if (bom.components !== undefined && !Array.isArray(bom.components)) fail('components is not an array');
          fs.writeFileSync(file, JSON.stringify(bom, null, 2) + '\n');
          console.log('SBOM ok: ' + name + '@' + main.version + ', ' + (bom.components || []).length + ' components');
          JS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$SBOM_FILE" \
            --title "chronary-go ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
